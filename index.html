<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GYN Surgery Spin the Wheel Challenge</title>
<style>
:root{--green:#0b6b4b;--gold:#f4c542;--cream:#fffaf0;--dark:#17342a;--red:#b42318}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#edf8f3,#fff8dc);color:var(--dark)}
header{background:var(--green);color:white;padding:18px 24px;text-align:center}
header h1{margin:0;font-size:clamp(24px,4vw,42px)}
header p{margin:6px 0 0}
main{max-width:1200px;margin:auto;padding:18px}
.banner{padding:18px;border-radius:18px;text-align:center;font-size:clamp(28px,5vw,52px);font-weight:900;margin-bottom:16px;box-shadow:0 8px 20px rgba(0,0,0,.12)}
.team1{background:var(--green);color:white;border:5px solid var(--gold)}
.team2{background:var(--gold);color:var(--dark);border:5px solid var(--green)}
.grid{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:16px}
.card{background:white;border-radius:18px;padding:18px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.team-card{text-align:center;opacity:.55;border:5px solid #d4ddd8;transition:.2s}
.team-card.active{opacity:1;transform:scale(1.02);border-color:var(--gold)}
#team2.active{border-color:var(--green)}
.score{font-size:54px;font-weight:900;margin:8px 0}
button{border:none;border-radius:12px;padding:12px 18px;font-size:16px;font-weight:800;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
.primary{background:var(--gold);color:#2b2600}
.secondary{background:white;color:var(--green);border:2px solid var(--green)}
.yes{background:#16815b;color:white;font-size:22px;padding:16px 28px}
.no{background:#c0392b;color:white;font-size:22px;padding:16px 28px}
.wheelbox{text-align:center}
.pointer{width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:30px solid var(--dark);margin:0 auto -5px}
canvas{width:280px;height:280px;border-radius:50%;border:8px solid white;box-shadow:0 0 0 4px var(--green),0 10px 25px rgba(0,0,0,.16);transition:transform 4s cubic-bezier(.17,.67,.16,1)}
.message{font-size:22px;font-weight:800;text-align:center;margin:14px 0;min-height:30px;color:#8a2d12}
.question-card{margin-top:16px}
.meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.badge{background:#eaf5f0;padding:8px 12px;border-radius:999px;font-weight:800}
.timer{font-size:36px;font-weight:900}
.question{margin-top:14px;background:var(--cream);border-radius:16px;padding:24px;min-height:170px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(24px,3vw,36px);line-height:1.25}
.qnum{font-size:18px;color:var(--green);font-weight:900;margin-bottom:10px}
.choices{display:grid;gap:10px;margin-top:14px}.choice{background:#fff;border:2px solid #cfdad5;border-radius:12px;padding:12px 15px;font-size:18px;font-weight:700;text-align:left}.choice .letter{color:var(--green);font-weight:900;margin-right:8px}.typehint{text-align:center;margin-top:10px;font-weight:900;color:var(--green);letter-spacing:.03em}.answer{display:none;margin-top:14px;background:#eef8f3;border-left:6px solid var(--green);padding:18px;border-radius:12px;font-size:21px}
.controls,.audio{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
select{padding:10px;border:2px solid var(--green);border-radius:10px;max-width:300px}
.progress{height:14px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-top:14px}
.progress div{height:100%;background:var(--green);width:0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:18px}
.modalbox{background:white;max-width:750px;width:100%;padding:24px;border-radius:18px;max-height:90vh;overflow:auto}
#timer.green{color:#16815b}
#timer.yellow{color:#b8860b}
#timer.red{color:#c0392b;animation:pulseTimer .6s infinite alternate}
@keyframes pulseTimer{from{transform:scale(1)}to{transform:scale(1.12)}}
.steal-mode{background:linear-gradient(135deg,#fff0f0,#ffe9cc)!important}
.final-mode{background:radial-gradient(circle at top,#232946,#0f172a)!important;color:white}
.final-mode .card,.final-mode .question-card{background:#1f2937;color:white}
.final-mode .question{background:#111827;color:white}
.final-mode .badge{background:#374151;color:white}
.confetti-piece{position:fixed;width:10px;height:18px;top:-20px;z-index:9999;animation:fall 3.2s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.9}}
.score-report{font-size:28px;font-weight:900;text-align:center;padding:18px;border-radius:16px;background:#fff5cc;border:3px solid var(--gold);margin-top:14px}
@media(max-width:850px){.grid{grid-template-columns:1fr}canvas{width:240px;height:240px}}
</style>
</head>
<body>
<header><h1>GYN Surgery Spin the Wheel Challenge</h1><p>Automatic two-team classroom review game</p></header>
<main>
<div id="turnBanner" class="banner team1">TEAM 1 — SPIN NOW</div>
<div id="message" class="message">Team 1 begins the game.</div>

<section class="grid">
<div class="card team-card active" id="team1">
<h2>Team 1</h2><div class="score" id="score1">0</div>
<button class="secondary" onclick="adjustScore(0,100)">+100</button>
<button class="secondary" onclick="adjustScore(0,-100)">−100</button>
</div>

<div class="card wheelbox">
<div class="pointer"></div>
<canvas id="wheel" width="500" height="500"></canvas>
<h3 id="wheelResult">Spin to begin</h3>
<button class="primary" id="spinBtn" onclick="spinWheel()">SPIN THE WHEEL</button>
</div>

<div class="card team-card" id="team2">
<h2>Team 2</h2><div class="score" id="score2">0</div>
<button class="secondary" onclick="adjustScore(1,100)">+100</button>
<button class="secondary" onclick="adjustScore(1,-100)">−100</button>
</div>
</section>

<section class="card question-card">
<div class="meta">
<span class="badge" id="count">Question 0 of <span id="questionTotal">54</span></span>
<span class="badge">Value: <span id="value">—</span></span>
<span class="timer" id="timer">30</span>
</div>
<div class="question"><div><div class="qnum" id="qnum">QUESTION —</div><div id="qtext">Spin the wheel to load a question.</div></div></div>
<div id="typeHint" class="typehint"></div><div id="choices" class="choices"></div><div class="answer" id="answer"></div>

<div class="controls" id="judgeControls">
<button class="yes" id="yesBtn" onclick="answerYes()" disabled>✓ YES, CORRECT</button>
<button class="no" id="noBtn" onclick="answerNo()" disabled>✗ NO</button>
</div>

<div class="controls" id="stealControls" style="display:none">
<button class="yes" onclick="stealCorrect()">✓ STEAL CORRECT</button>
<button class="no" onclick="stealWrong()">✗ STEAL INCORRECT / NO STEAL</button>
</div>

<div class="audio">
<label><strong>Voice:</strong></label><select id="voiceSelect" onchange="changeVoice()"></select>
<button class="secondary" onclick="repeatQuestion()">Read Question</button>
<button class="secondary" onclick="toggleAutoRead()" id="autoBtn">Auto-Read: ON</button>
<button class="secondary" onclick="toggleSounds()" id="soundBtn">Sounds: ON</button>
<button class="secondary" onclick="stopSpeaking()">Stop Reading</button>
<button class="secondary" onclick="resetGame()">Reset Game</button>
</div>
<div id="scoreReport" class="score-report" style="display:none"></div>
<div class="progress"><div id="progress"></div></div>
</section>
</main>

<div class="modal" id="finalModal">
<div class="modalbox">
<h2 id="finalHeading">Final Jackpot</h2>
<p id="finalText"></p><div id="finalChoices" class="choices"></div>
<div class="answer" id="finalAnswer"></div>
<div class="controls">
<button class="secondary" onclick="readFinal()">Read Final Question</button>
<button class="secondary" onclick="showFinalAnswer()">Show/Read Answer</button>
<button class="yes" onclick="awardFinal(0)">Award Team 1</button>
<button class="yes" onclick="awardFinal(1)">Award Team 2</button>
<button class="secondary" onclick="closeFinal()">Close</button>
</div>
</div>
</div>

<script>
const QUESTIONS=[{"type":"mc","q":"Bulging of the bladder into the vaginal wall is called:","options":["Rectocele","Cystocele","Uterine prolapse","Fistula"],"correct":[1]},{"type":"mc","q":"What is the first-line exercise treatment for pelvic organ prolapse?","options":["Kegel exercises","Bed rest","Abdominal crunches","Fluid restriction"],"correct":[0]},{"type":"tf","q":"Obesity is a modifiable risk factor for pelvic organ prolapse.","options":["True","False"],"correct":[0]},{"type":"mc","q":"Which device can support pelvic organs without surgery?","options":["Pessary","Diaphragm","Foley catheter","Cervical cap"],"correct":[0]},{"type":"mc","q":"Which description matches Stage III pelvic organ prolapse in the course content?","options":["No descent","Above the hymen","Two to three centimeters below the hymen","Complete eversion only"],"correct":[2]},{"type":"mc","q":"Leakage of urine when coughing, sneezing, or laughing is:","options":["Urge incontinence","Stress incontinence","Overflow incontinence","Functional incontinence"],"correct":[1]},{"type":"mc","q":"A strong, sudden urge to urinate with inability to delay voiding is:","options":["Stress incontinence","Urge incontinence","Overflow incontinence","Fistula"],"correct":[1]},{"type":"mc","q":"Which medication class is commonly used to treat urge incontinence?","options":["Anticholinergics","Antibiotics","Anticoagulants","Bisphosphonates"],"correct":[0]},{"type":"mc","q":"A client leaks urine when laughing but also has urgency and cannot delay voiding. Which type is this?","options":["Stress only","Urge only","Mixed urinary incontinence","Overflow"],"correct":[2]},{"type":"mc","q":"Which common stimulant is a bladder irritant that may worsen urinary urgency?","options":["Caffeine","Calcium","Vitamin D","Iron"],"correct":[0]},{"type":"mc","q":"A small, soft growth that may cause postcoital bleeding is a:","options":["Cervical polyp","Ovarian cyst","Fibroid","Fistula"],"correct":[0]},{"type":"mc","q":"A benign uterine tumor commonly associated with heavy menstrual bleeding is a:","options":["Leiomyoma/fibroid","Cystocele","Cervical polyp","Fistula"],"correct":[0]},{"type":"mc","q":"A fluid-filled sac on the ovary is called a:","options":["Ovarian cyst","Fibroid","Polyp","Fistula"],"correct":[0]},{"type":"mc","q":"An abnormal connection between organs such as the bladder and vagina is a:","options":["Fistula","Cystocele","Rectocele","Fibroid"],"correct":[0]},{"type":"mc","q":"Which PCOS finding refers to excess androgen activity?","options":["Hyperandrogenism","Amenorrhea","Osteoporosis","Hypoinsulinemia"],"correct":[0]},{"type":"mc","q":"Which reproductive cancer is identified in the course content as the most deadly?","options":["Ovarian cancer","Cervical cancer","Endometrial cancer","Vulvar cancer"],"correct":[0]},{"type":"tf","q":"HPV infection is strongly associated with cervical cancer.","options":["True","False"],"correct":[0]},{"type":"mc","q":"What is the most common presenting symptom of breast cancer in the course content?","options":["Breast lump or mass","Fever","Vaginal bleeding","Urinary urgency"],"correct":[0]},{"type":"mc","q":"Which early ovarian cancer symptom means feeling full after eating only a small amount?","options":["Early satiety","Dysuria","Amenorrhea","Galactorrhea"],"correct":[0]},{"type":"mc","q":"Postmenopausal bleeding is most concerning for which cancer?","options":["Endometrial cancer","Ovarian cancer","Breast cancer","Vulvar cancer"],"correct":[0]},{"type":"mc","q":"At what age should routine Pap smear screening begin according to the course content?","options":["18","21","25","30"],"correct":[1]},{"type":"mc","q":"How often should Pap smears be performed for patients ages 21 through 29 according to the course content?","options":["Every year","Every 2 years","Every 3 years","Every 5 years"],"correct":[2]},{"type":"mc","q":"How often is cervical cancer screening recommended for ages 30 through 65 in the course content?","options":["Every year","Every 2 years","Every 3 years only","Every 5 years with appropriate HPV-based screening"],"correct":[3]},{"type":"mc","q":"What is the gold-standard screening test for breast cancer in the course content?","options":["Digital mammography","Clinical breast exam","Breast ultrasound","Breast MRI for everyone"],"correct":[0]},{"type":"mc","q":"During a vasectomy, which structure is cut or sealed?","options":["Vas deferens","Ureter","Urethra","Epididymis"],"correct":[0]},{"type":"mc","q":"What medication regimen is used for medical abortion in the course content?","options":["Mifepristone followed by misoprostol","Oxytocin followed by estrogen","Clomiphene followed by progesterone","Methotrexate followed by calcium"],"correct":[0]},{"type":"sata","q":"A 36-year-old client smokes half a pack per day and wants contraception for the next 3 to 5 years. Which methods should the nurse expect the provider to consider? Select all that apply.","options":["Progestin-only pill (mini pill)","Combined oral contraceptive pill","Copper IUD (Paragard)","Nexplanon","Transdermal contraceptive patch","Male condoms"],"correct":[0,2,3,5]},{"type":"mc","q":"An American Indian child is hospitalized with pneumonia. His grandmother has legal custody and requests a tribal healing ceremony and an herbal tea. What is the nurse's best action?","options":["Prohibit both until discharge","Direct teaching to the uncle","Ask about both practices, have the tea checked for safety, accommodate the ceremony when possible, and include the grandmother in decisions","Contact the child's mother for approval"],"correct":[2]},{"type":"mc","q":"A parent demands obedience without explanation and threatens spanking. Which teaching is most appropriate?","options":["Let the child set the rules","Give a simple reason for the rule and offer an age-appropriate choice","Delay all consequences","Use consistent spanking"],"correct":[1]},{"type":"mc","q":"A mother and her children from a previous marriage live with her new husband and his child from a prior relationship. This is a:","options":["Nuclear family","Extended family","Blended family","Cohabiting family"],"correct":[2]},{"type":"mc","q":"A divorced father is raising his two young children. This is a:","options":["Single-parent family","Extended family","Nuclear family","Adoptive family"],"correct":[0]},{"type":"mc","q":"A 9-year-old is frequently hungry and unkempt and says the parents do not care what the child does as long as the child stays out of the way. Which parenting style is this?","options":["Authoritative","Rejecting-neglecting","Permissive","Authoritarian"],"correct":[1]},{"type":"mc","q":"A Hispanic client asks the nurse to discuss his diabetes meal plan and medications with his wife because she manages the family's health needs. Which course concept does this reflect?","options":["Individual independence","The mother/wife as family health caretaker and decision-maker","Equal authority is required in every family","Relatives should not be involved"],"correct":[1]},{"type":"mc","q":"A Hindu client refuses a beef-derived medication because it violates religious beliefs. What should the nurse do?","options":["Insist the client take it","Ask the provider for an acceptable alternative","Document refusal and take no further action","Tell the client medical treatment overrides the belief"],"correct":[1]},{"type":"mc","q":"A critically ill premature newborn's Catholic mother asks for baptism, but the chaplain is unavailable. What action is appropriate?","options":["Tell her only clergy may baptize","Decline the request","Offer to perform the baptism with water and the appropriate words","Wait until the funeral service"],"correct":[2]},{"type":"mc","q":"A competent Christian Scientist client with severe pneumonia refuses antibiotics and oxygen. What is the nurse's best response?","options":["Force treatment","Notify the provider, verify informed understanding, and support the client's decision","Call security","Seek a court order immediately"],"correct":[1]},{"type":"mc","q":"Which family decision-making pattern is identified in the course test content as common in many African American families?","options":["Father as sole decision-maker","Strong matriarchal system with women in key decision-making roles","Eldest male outside the family makes decisions","All decisions are made independently"],"correct":[1]},{"type":"mc","q":"A parent allows a 5-year-old to make most decisions, sets few rules, and rarely enforces discipline. Which parenting style is this?","options":["Authoritative","Authoritarian","Permissive","Rejecting-neglecting"],"correct":[2]},{"type":"mc","q":"On postoperative day 1 after a modified radical mastectomy, which activity should the nurse encourage on the affected side?","options":["Immobilize the arm in a sling","Squeeze a soft ball with the affected hand several times a day","Lift 10- to 15-pound weights","Avoid all arm movement until the drain is removed"],"correct":[1]},{"type":"mc","q":"A client with PCOS has obesity, irregular menses, and hirsutism. Which long-term complication is she at increased risk for?","options":["Type 2 diabetes","Osteoporosis","Cervical cancer","Hypothyroidism"],"correct":[0]},{"type":"mc","q":"A client with urge incontinence takes oxybutynin. Which teaching is appropriate?","options":["Restrict fluids below 1 liter daily","Hold urine for 8 hours","Reduce coffee, soda, and artificial sweeteners","Stop pelvic floor exercises"],"correct":[2]},{"type":"mc","q":"A client has right shoulder pain on postoperative day 1 after laparoscopic hysterectomy. Vital signs are stable and there is no chest pain or shortness of breath. What is the best response?","options":["Massage the fundus","Keep the client on bed rest","Call rapid response for pulmonary embolism","Explain that laparoscopic gas can cause referred shoulder pain that may last up to 7 days"],"correct":[3]},{"type":"mc","q":"Which statement after cesarean birth shows a need for more teaching?","options":["I will not lift anything heavier than my baby","I will walk around the house each day","I will take a warm tub bath for soreness","I will return for an incision check"],"correct":[2]},{"type":"mc","q":"Which evaluation method is identified as the gold standard for diagnosing endometriosis?","options":["Pelvic examination","Transvaginal ultrasound","Laparoscopy","Hysterosalpingogram"],"correct":[2]},{"type":"mc","q":"Which history finding is identified as a risk factor for pelvic inflammatory disease (PID)?","options":["Leaving a cervical cap in place longer than 72 hours","Genetic predisposition","Gestational diabetes","Environmental exposure"],"correct":[0]},{"type":"sata","q":"Which findings can occur with perimenopause or menopause? Select all that apply.","options":["Irregular periods","Hot flashes","Night sweats","Sleep disturbances","Vaginal dryness","Irritability and anxiety","Increased libido"],"correct":[0,1,2,3,4,5]},{"type":"sata","q":"Which findings support PCOS? Select all that apply.","options":["Elevated blood insulin levels","Decreased androgen levels","Anovulation","Waist circumference of 30 inches"],"correct":[0,2]},{"type":"mc","q":"Which history finding is most consistent with endometriosis?","options":["Dysmenorrhea unresponsive to NSAIDs","History of PID","Bloating only before menses","Atypical Pap smear"],"correct":[0]},{"type":"mc","q":"A client with osteoporosis already takes calcium. Which supplement should the nurse recommend adding based on the test content?","options":["Vitamin E","Fish oil","Fiber","Vitamin D"],"correct":[3]},{"type":"tf","q":"Genital herpes has no cure, but drug therapy can reduce symptoms and recurrences.","options":["True","False"],"correct":[0]},{"type":"mc","q":"A client with an intact uterus begins estrogen therapy for severe hot flashes. Which addition should the nurse anticipate?","options":["Bisphosphonate instead of estrogen","Progestin with the estrogen","No additional medication","Thyroid hormone replacement"],"correct":[1]},{"type":"mc","q":"A 17-year-old who previously had regular periods has had no menses for 4 months while training more than 40 miles each week. Pregnancy test is negative. Which condition is most likely?","options":["Primary amenorrhea","Primary dysmenorrhea","Perimenopause","Secondary amenorrhea"],"correct":[3]},{"type":"mc","q":"Which statement shows correct understanding of clomiphene citrate (Clomid) teaching?","options":["I can take it for unlimited cycles","There is no chance of multiple gestation","We should have intercourse every other day for 1 week, starting after day 5 of the medication","It works by directly stimulating ovarian follicles"],"correct":[2]},{"type":"sata","q":"Which hormonal or long-acting contraceptive methods in the course table are marked as options for HIGH-RISK patients? Select all that apply.","options":["Progestin-only contraception","Depo-Provera","Nexplanon","IUD","Combined estrogen-progestin pill"],"correct":[0,1,2,3]}];
const FINAL={"type":"mc","q":"A 46-year-old woman with obesity and chronic constipation reports pelvic pressure, a visible anterior vaginal bulge, and urine leakage when she coughs. What is the most likely diagnosis?","options":["Rectocele","Cystocele","Urge incontinence","Ovarian cyst"],"correct":[1]}
const segments=[
{label:"100",type:"points",value:100},{label:"200",type:"points",value:200},
{label:"300",type:"points",value:300},{label:"400",type:"points",value:400},
{label:"500",type:"points",value:500},{label:"DOUBLE",type:"double"},
{label:"+200 BONUS",type:"bonus"},{label:"SPIN AGAIN",type:"spinagain"},
{label:"LOSE TURN",type:"lose"},{label:"JACKPOT",type:"points",value:1000}
];
let scores=[0,0],currentTeam=0,turnOwner=0,currentPoints=0,qIndex=0,state="ready";
let timerInt=null,timeLeft=30,currentTimerLength=30,rotation=0,autoRead=true,soundsOn=true,selectedVoice=null,musicNodes=[],timerMode="question";

const canvas=document.getElementById("wheel"),ctx=canvas.getContext("2d");
function drawWheel(){
 const arc=2*Math.PI/segments.length;
 segments.forEach((s,i)=>{ctx.beginPath();ctx.moveTo(250,250);ctx.arc(250,250,240,i*arc,(i+1)*arc);ctx.closePath();
 ctx.fillStyle=i%2===0?"#0b6b4b":"#f4c542";ctx.fill();ctx.save();ctx.translate(250,250);ctx.rotate(i*arc+arc/2);
 ctx.textAlign="right";ctx.fillStyle=i%2===0?"white":"#17342a";ctx.font="bold 22px Arial";ctx.fillText(s.label,220,7);ctx.restore();});
}
drawWheel();

function loadVoices(){
 const voices=speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.startsWith("en"));
 const prefs=[/Natural/i,/Neural/i,/Microsoft Ava/i,/Microsoft Jenny/i,/Microsoft Aria/i,/Google US English/i,/Samantha/i];
 selectedVoice=null;
 for(const p of prefs){selectedVoice=voices.find(v=>p.test(v.name));if(selectedVoice)break;}
 selectedVoice=selectedVoice||voices.find(v=>v.lang==="en-US")||voices[0]||null;
 const s=document.getElementById("voiceSelect");s.innerHTML="";
 voices.forEach(v=>{const o=document.createElement("option");o.value=v.name;o.textContent=v.name+" ("+v.lang+")";s.appendChild(o);});
 if(selectedVoice)s.value=selectedVoice.name;
}
if("speechSynthesis" in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
function changeVoice(){selectedVoice=speechSynthesis.getVoices().find(v=>v.name===document.getElementById("voiceSelect").value)||selectedVoice;speak("This is the selected game voice.");}
function speak(t,onend=null){if(!autoRead||!("speechSynthesis" in window)){if(onend)onend();return;}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=0.98;u.pitch=1.02;if(selectedVoice)u.voice=selectedVoice;if(onend)u.onend=onend;speechSynthesis.speak(u);}
function stopSpeaking(){if("speechSynthesis" in window)speechSynthesis.cancel();}

function tone(f,d=.1,type="sine",delay=0){if(!soundsOn)return;try{const A=window.AudioContext||window.webkitAudioContext;const ac=window.ac||(window.ac=new A());if(ac.state==="suspended")ac.resume();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type=type;g.gain.setValueAtTime(.0001,ac.currentTime+delay);g.gain.exponentialRampToValueAtTime(.18,ac.currentTime+delay+.01);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+delay+d);o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+delay);o.stop(ac.currentTime+delay+d+.02);}catch(e){}}
function spinSound(){for(let i=0;i<22;i++)tone(250+i*15,.04,"square",i*.085);tone(800,.18,"sine",1.95);}
function correctSound(){tone(523,.12);tone(659,.12,"sine",.12);tone(784,.25,"sine",.24);}
function wrongSound(){tone(220,.2,"sawtooth");tone(165,.3,"sawtooth",.18);}
function loseSound(){tone(300,.1,"triangle");tone(230,.1,"triangle",.12);tone(170,.25,"triangle",.24);}

function setBanner(text){const b=document.getElementById("turnBanner");b.textContent=text;b.className="banner "+(currentTeam===0?"team1":"team2");}
function setMessage(t){document.getElementById("message").textContent=t;}
function updateTeams(){document.getElementById("team1").classList.toggle("active",currentTeam===0);document.getElementById("team2").classList.toggle("active",currentTeam===1);setBanner(`TEAM ${currentTeam+1} — ${state==="steal"?"STEAL CHANCE":"SPIN NOW"}`);}
function updateScores(){document.getElementById("score1").textContent=scores[0];document.getElementById("score2").textContent=scores[1];}
function adjustScore(t,n){scores[t]=Math.max(0,scores[t]+n);updateScores();}

function spinWheel(){
 if(state!=="ready")return;turnOwner=currentTeam;stopSpeaking();spinSound();state="spinning";document.getElementById("spinBtn").disabled=true;setMessage(`Team ${currentTeam+1} is spinning...`);
 const idx=Math.floor(Math.random()*segments.length),arc=360/segments.length;rotation+=2160+(360-(idx*arc+arc/2)-90);canvas.style.transform=`rotate(${rotation}deg)`;
 setTimeout(()=>handleSegment(segments[idx]),4100);
}
function handleSegment(s){
 document.getElementById("wheelResult").textContent=s.label;
 if(s.type==="spinagain"){state="ready";document.getElementById("spinBtn").disabled=false;setMessage(`Team ${currentTeam+1} spins again.`);speak(`Team ${currentTeam+1}, spin again.`);return;}
 if(s.type==="lose"){loseSound();const lost=currentTeam;currentTeam=1-currentTeam;state="ready";updateTeams();document.getElementById("spinBtn").disabled=false;setMessage(`Team ${lost+1} lost the turn.`);speak(`Team ${lost+1} loses the turn. Team ${currentTeam+1}, please spin the wheel.`);return;}
 currentPoints=s.type==="double"?600:s.type==="bonus"?500:s.value;
 loadQuestion();
}
function answerText(q){return q.correct.map(i=>String.fromCharCode(65+i)+". "+q.options[i]).join("; ")}
function renderChoices(q,targetId="choices"){
 const box=document.getElementById(targetId);if(!box)return;
 box.innerHTML=q.options.map((opt,i)=>'<div class="choice"><span class="letter">'+String.fromCharCode(65+i)+'.</span>'+opt+'</div>').join("");
}
function questionTypeLabel(q){return q.type==="sata"?"SELECT ALL THAT APPLY":q.type==="tf"?"TRUE / FALSE":"MULTIPLE CHOICE"}
function loadQuestion(){
 if(qIndex>=QUESTIONS.length){showFinal();return;}
 const q=QUESTIONS[qIndex];document.getElementById("qnum").textContent=`QUESTION ${qIndex+1}`;document.getElementById("qtext").textContent=q.q;
 document.getElementById("typeHint").textContent=questionTypeLabel(q);renderChoices(q);
 document.getElementById("answer").textContent=`Correct answer: ${answerText(q)}`;document.getElementById("answer").style.display="none";
 document.getElementById("count").textContent=`Question ${qIndex+1} of ${QUESTIONS.length}`;document.getElementById("value").textContent=currentPoints+" points";
 currentTimerLength=30; timerMode="question"; document.body.classList.remove("steal-mode","final-mode"); state="question";document.getElementById("yesBtn").disabled=false;document.getElementById("noBtn").disabled=false;
 document.getElementById("judgeControls").style.display="flex";document.getElementById("stealControls").style.display="none";
 setMessage(`Team ${currentTeam+1}: answer for ${currentPoints} points.`);
 const spokenOptions=q.options.map((o,i)=>String.fromCharCode(65+i)+", "+o).join(". ");
 speak(`Question ${qIndex+1}. ${questionTypeLabel(q)}. ${q.q} ${spokenOptions}. The 30 second timer will begin in 3, 2, 1.`,startTimer);
}
function stopTimerMusic(){
 musicNodes.forEach(n=>{try{n.stop();}catch(e){}});
 musicNodes=[];
}
function startTimerMusic(){
 if(!soundsOn)return;
 stopTimerMusic();
 try{
  const A=window.AudioContext||window.webkitAudioContext;
  const ac=window.ac||(window.ac=new A());
  if(ac.state==="suspended")ac.resume();
  const questionNotes=[261.6,329.6,392,329.6,293.7,349.2,440,349.2];
  const stealNotes=[220,277.2,329.6,277.2,246.9,311.1,370,311.1];
  const finalNotes=[196,246.9,293.7,392,293.7,246.9];
  const notes=timerMode==="steal"?stealNotes:timerMode==="final"?finalNotes:questionNotes;
  const step=timerMode==="steal"?.42:timerMode==="final"?.58:.5;
  const total=Math.ceil(currentTimerLength/step);
  for(let i=0;i<total;i++){
   const o=ac.createOscillator(),g=ac.createGain();
   o.type=timerMode==="steal"?"square":timerMode==="final"?"sawtooth":"triangle";
   o.frequency.value=notes[i%notes.length];
   const start=ac.currentTime+i*step;
   g.gain.setValueAtTime(.0001,start);
   g.gain.exponentialRampToValueAtTime(timerMode==="final"?.028:.035,start+.03);
   g.gain.exponentialRampToValueAtTime(.0001,start+step*.82);
   o.connect(g);g.connect(ac.destination);o.start(start);o.stop(start+step*.88);
   musicNodes.push(o);
  }
 }catch(e){}
}
function startTimer(){
 clearInterval(timerInt);
 stopTimerMusic();
 timeLeft=currentTimerLength;
 const timerEl=document.getElementById("timer");
 timerEl.textContent=timeLeft;
 updateTimerColor();
 startTimerMusic();
 timerInt=setInterval(()=>{
  timeLeft--;
  timerEl.textContent=timeLeft;
  updateTimerColor();
  if(timeLeft<=5&&timeLeft>0)tone(760,.08,"square");
  if(timeLeft<=0){
   clearInterval(timerInt);
   stopTimerMusic();
   tone(150,.5,"sawtooth");
   setMessage("Time is up. Mark whether the team's selected answer was correct.");
   speak("Time is up. Was the team's selected answer correct?");
  }
 },1000);
}
function updateTimerColor(){
 const t=document.getElementById("timer");
 t.classList.remove("green","yellow","red");
 if(timeLeft>15)t.classList.add("green");
 else if(timeLeft>5)t.classList.add("yellow");
 else t.classList.add("red");
}
function scoreUpdateText(){
 const s1=scores[0],s2=scores[1];
 if(s1===s2)return `The score is tied at ${s1} points each.`;
 const leader=s1>s2?1:2;
 const lead=Math.abs(s1-s2);
 return `Team ${leader} is winning. The score is Team 1, ${s1} points, and Team 2, ${s2} points. Team ${leader} leads by ${lead} points.`;
}
function announceScore(next){
 const completedQuestion=qIndex+1;
 if(completedQuestion % 5 === 0){
  const update=`After ${completedQuestion} questions, ${scoreUpdateText()}`;
  const box=document.getElementById("scoreReport");
  box.textContent=update;
  box.style.display="block";
  setMessage(update);
  speak(update,()=>{setTimeout(()=>{box.style.display="none";next();},700);});
 } else {
  next();
 }
}
function answerYes(){clearInterval(timerInt);stopTimerMusic();correctSound();scores[currentTeam]+=currentPoints;updateScores();document.getElementById("answer").style.display="block";disableJudge();speak(`Correct. The answer is: ${answerText(QUESTIONS[qIndex])}`,()=>announceScore(finishQuestion));}
function answerNo(){clearInterval(timerInt);stopTimerMusic();wrongSound();currentTeam=1-turnOwner;currentTimerLength=15;timerMode="steal";document.body.classList.add("steal-mode");state="steal";updateTeams();document.getElementById("judgeControls").style.display="none";document.getElementById("stealControls").style.display="flex";
 setMessage(`Team ${currentTeam+1} may steal for ${currentPoints} points.`);
 speak(`Team ${currentTeam+1}, you have a chance to steal for ${currentPoints} points. Discuss with your team and give one final answer. If correct, you earn the points. If incorrect, no points are awarded. The 15 second timer will begin in 3, 2, 1.`,startTimer);
}
function stealCorrect(){clearInterval(timerInt);stopTimerMusic();correctSound();scores[currentTeam]+=currentPoints;updateScores();document.getElementById("answer").style.display="block";document.getElementById("stealControls").style.display="none";speak(`The steal is correct. The answer is: ${answerText(QUESTIONS[qIndex])}`,()=>announceScore(finishQuestion));}
function stealWrong(){clearInterval(timerInt);stopTimerMusic();wrongSound();document.getElementById("answer").style.display="block";document.getElementById("stealControls").style.display="none";speak(`The steal is incorrect, or no steal was attempted. The correct answer is: ${answerText(QUESTIONS[qIndex])}`,()=>announceScore(finishQuestion));}
function disableJudge(){document.getElementById("yesBtn").disabled=true;document.getElementById("noBtn").disabled=true;}
function finishQuestion(){document.body.classList.remove("steal-mode");qIndex++;document.getElementById("progress").style.width=(qIndex/QUESTIONS.length*100)+"%";currentTeam=1-turnOwner;state="ready";updateTeams();document.getElementById("spinBtn").disabled=false;disableJudge();document.getElementById("judgeControls").style.display="flex";document.getElementById("stealControls").style.display="none";
 document.getElementById("qnum").textContent=qIndex>=QUESTIONS.length?"FINAL ROUND":"QUESTION —";document.getElementById("qtext").textContent=qIndex>=QUESTIONS.length?"Regular questions complete. Final Jackpot is ready!":"Spin the wheel to load the next question.";document.getElementById("value").textContent="—";document.getElementById("answer").style.display="none";document.getElementById("choices").innerHTML="";document.getElementById("typeHint").textContent="";
 if(qIndex>=QUESTIONS.length)setTimeout(showFinal,500);else{setMessage(`Team ${currentTeam+1} spins next.`);speak(`Team ${currentTeam+1}, it is your turn. Please spin the wheel.`);}
}
function repeatQuestion(){if(qIndex<QUESTIONS.length){const q=QUESTIONS[qIndex];speak(`Question ${qIndex+1}. ${questionTypeLabel(q)}. ${q.q} `+q.options.map((o,i)=>String.fromCharCode(65+i)+", "+o).join(". "));}}
function toggleAutoRead(){autoRead=!autoRead;document.getElementById("autoBtn").textContent="Auto-Read: "+(autoRead?"ON":"OFF");if(!autoRead)stopSpeaking();}
function toggleSounds(){soundsOn=!soundsOn;document.getElementById("soundBtn").textContent="Sounds: "+(soundsOn?"ON":"OFF");}
function resetGame(){if(!confirm("Reset the entire game?"))return;stopSpeaking();clearInterval(timerInt);stopTimerMusic();document.body.classList.remove("steal-mode","final-mode");scores=[0,0];currentTeam=0;turnOwner=0;currentPoints=0;qIndex=0;state="ready";timeLeft=30;rotation=0;canvas.style.transform="rotate(0deg)";updateScores();updateTeams();document.getElementById("spinBtn").disabled=false;document.getElementById("qnum").textContent="QUESTION —";document.getElementById("qtext").textContent="Spin the wheel to load a question.";document.getElementById("count").textContent=`Question 0 of ${QUESTIONS.length}`;document.getElementById("value").textContent="—";document.getElementById("timer").textContent="30";document.getElementById("progress").style.width="0";document.getElementById("answer").style.display="none";document.getElementById("choices").innerHTML="";document.getElementById("typeHint").textContent="";disableJudge();setMessage("Team 1 begins the game.");speak("Team 1 begins the game. Please spin the wheel.");}
function showFinal(){timerMode="final";currentTimerLength=30;document.body.classList.remove("steal-mode");document.body.classList.add("final-mode");document.getElementById("finalText").textContent=FINAL.q;renderChoices(FINAL,"finalChoices");document.getElementById("finalAnswer").textContent="Correct answer: "+answerText(FINAL);document.getElementById("finalAnswer").style.display="none";document.getElementById("finalModal").style.display="flex";document.getElementById("finalHeading").textContent=`Question ${QUESTIONS.length+1} — Final Jackpot`;speak(`Question ${QUESTIONS.length+1}. Final jackpot. Multiple choice. `+FINAL.q+" "+FINAL.options.map((o,i)=>String.fromCharCode(65+i)+", "+o).join(". ")+" The 15 second timer will begin in 3, 2, 1.",startTimer);}
function readFinal(){speak(`Question ${QUESTIONS.length+1}. Final jackpot. `+FINAL.q+" "+FINAL.options.map((o,i)=>String.fromCharCode(65+i)+", "+o).join(". "));}
function showFinalAnswer(){document.getElementById("finalAnswer").style.display="block";speak("The final answer is: "+answerText(FINAL));}
function launchConfetti(){
 const colors=["#f4c542","#0b6b4b","#ffffff","#e67e22","#3498db"];
 for(let i=0;i<120;i++){
  const d=document.createElement("div");
  d.className="confetti-piece";
  d.style.left=Math.random()*100+"vw";
  d.style.background=colors[Math.floor(Math.random()*colors.length)];
  d.style.animationDelay=(Math.random()*1.4)+"s";
  d.style.transform=`rotate(${Math.random()*360}deg)`;
  document.body.appendChild(d);
  setTimeout(()=>d.remove(),5000);
 }
}
function announceWinner(){
 let msg;
 if(scores[0]===scores[1]) msg=`The game ends in a tie. Both teams have ${scores[0]} points.`;
 else{
  const winner=scores[0]>scores[1]?1:2;
  msg=`Team ${winner} wins the game. Final score: Team 1, ${scores[0]} points. Team 2, ${scores[1]} points.`;
 }
 setMessage(msg);
 launchConfetti();
 speak(msg);
}
function awardFinal(t){scores[t]+=1000;updateScores();correctSound();speak(`Team ${t+1} earns 1000 points.`,announceWinner);}
function closeFinal(){document.getElementById("finalModal").style.display="none";clearInterval(timerInt);stopTimerMusic();document.body.classList.remove("final-mode");}
window.addEventListener("load",()=>setTimeout(()=>speak("Team 1 begins the game. Please spin the wheel."),700));
</script>
</body></html>
